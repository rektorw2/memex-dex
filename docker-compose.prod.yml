# Полный стек для запуска на одной машине (VPS).
# Для облачных платформ используйте их собственные конфиги — см. docs/DEPLOY.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-memex}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memex}"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: memex-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-memex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-memex}
      REDIS_URL: redis://redis:6379
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]

  worker:
    image: memex-api:latest
    restart: unless-stopped
    command: ["node", "apps/api/dist/workers/index.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-memex}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-memex}
      REDIS_URL: redis://redis:6379
    depends_on:
      api: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
