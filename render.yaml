# Render Blueprint — бесплатный тариф.
# Создать: Dashboard → New → Blueprint → выбрать этот репозиторий.
#
# Что здесь сознательно не используется:
#   • Postgres от Render — на free-тарифе база удаляется через 30 дней.
#     Вместо неё Neon: там бесплатный тариф бессрочный.
#   • Отдельный worker-сервис — фоновые процессы на Render платные.
#     Воркеры поднимаются внутри API через RUN_WORKERS_IN_API=true.
#   • Redis — в проекте не используется, оставлен в зависимостях на вырост.
#
# Ограничение free-тарифа: сервис засыпает после 15 минут простоя,
# первый запрос после сна ждёт около 50 секунд. Это нормально для демо
# и неприемлемо для торговли — там задержка означает проскальзывание.

services:
  - type: web
    name: memex-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    region: frankfurt

    # preDeployCommand здесь отсутствует: на бесплатном тарифе Render
    # эта возможность недоступна. Проверенные добавочные миграции
    # применяет entrypoint контейнера.
    #
    # Он знает конечный список миграций (KNOWN_MIGRATIONS в
    # production-schema-repair.ts) и применяет только их. Появилась
    # в репозитории миграция, которой он не знает, — он отказывается
    # работать: `migrate deploy` применяет всё непринятое, и единственная
    # защита от неосторожного ALTER — знать заранее, что именно уедет
    # в production.
    #
    # Отказывается он и при пустой, частично применённой или
    # противоречивой схеме. После применения схема перечитывается:
    # успешный код возврата означает, что команда не упала, а не что
    # колонки появились.
    #
    # ВАЖНО: добавляя миграцию, впишите её в KNOWN_MIGRATIONS. Иначе
    # деплой остановится с UNKNOWN_MIGRATION_PRESENT — это лучше, чем
    # молча не применить её, как однажды и вышло с возрастом рынка.
    #
    # Когда проект перейдёт на платный тариф, этот переход удаляется,
    # а миграции возвращаются в штатный preDeployCommand:
    #
    #   preDeployCommand: DATABASE_URL="$DIRECT_DATABASE_URL" npx prisma migrate deploy --schema=prisma/schema.prisma
    #
    # Прямое подключение для миграций принципиально: pgbouncer не
    # поддерживает advisory locks, на которых держится Prisma Migrate.

    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000

      # Строка подключения из Neon. Обязательно с ?sslmode=require
      # и через pooled-эндпоинт (-pooler в имени хоста): бесплатный
      # Postgres быстро упирается в лимит прямых соединений.
      - key: DATABASE_URL
        sync: false

      # Прямое подключение (строка БЕЗ -pooler). Нужно для
      # prisma migrate deploy: через пул миграции не проходят.
      - key: DIRECT_DATABASE_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true

      # Адрес фронтенда на GitHub Pages. Без него браузер заблокирует
      # все запросы, а в логах API будет пусто.
      # Формат: https://<пользователь>.github.io
      - key: CORS_ORIGINS
        sync: false

      # Воркеры внутри API — см. комментарий выше.
      - key: RUN_WORKERS_IN_API
        value: 'true'

      # Реальные котировки, транзакции в сеть не отправляются.
      - key: EXECUTION_MODE
        value: paper
      - key: FUNDING_ENABLED
        value: "false"
      - key: LIVE_AGENT_ENABLED
        value: "false"
      - key: LIVE_EXECUTION_ENABLED
        value: "false"
      - key: WITHDRAWALS_ENABLED
        value: "false"
      - key: LIVE_RPC_READY
        value: "false"
      - key: LIVE_RECONCILIATION_ENABLED
        value: "false"
      - key: LIVE_MIGRATIONS_READY
        value: "false"
      - key: KMS_SIGNING_ENABLED
        value: "false"
      - key: LIVE_AGENT_CONTROL_MODE
        value: semi-auto

      - key: KMS_PROVIDER
        value: local
      - key: KMS_LOCAL_MASTER_KEY
        generateValue: true

      - key: PERFORMANCE_FEE_BPS
        value: 1000
      - key: MAX_SLIPPAGE_BPS
        value: 300
      - key: MIN_LIQUIDITY_USD
        value: 15000
      - key: COPY_MAX_ALLOCATION_PCT
        value: 25

      # Публичные RPC годятся только для демонстрации: лимиты запросов
      # и задержки превращаются в проскальзывание на реальных сделках.
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: BNB_RPC_URL
        value: https://bsc-dataseed.binance.org

      - key: ZEROX_API_KEY
        sync: false

      # OKX OnchainOS: рынок и живая вкладка GEMS. Секреты задаются
      # только в Render; WebSocket даёт сигнал сразу, REST страхует
      # перезапуск и обрыв соединения.
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_PASSPHRASE
        sync: false
      - key: OKX_PROJECT_ID
        sync: false
      - key: OKX_WS_ENABLED
        value: 'true'
      - key: OKX_SIGNAL_REST_FALLBACK_INTERVAL_MS
        value: '60000'
