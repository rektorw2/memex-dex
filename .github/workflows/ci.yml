# Проверка каждого пуша и pull request.
# Держит в тонусе то, что нельзя проверить глазами: расчёт комиссий,
# учёт позиций и срабатывание ордеров.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Генерация Prisma Client
        # Prisma требует, чтобы переменная из datasource существовала, даже
        # когда просто генерирует типы и никуда не подключается. Настоящая
        # база в CI не нужна и не должна быть доступна — подставляем заглушку.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: npm run db:generate

      - name: Сборка ядра
        run: npm run build -w @memex/core

      - name: Проверка типов во всех пакетах
        run: |
          npx tsc -p packages/core/tsconfig.json --noEmit
          npx tsc -p apps/api/tsconfig.json --noEmit
          npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Проверка типов в скриптах
        # Скрипты не входят в сборку API — их запускает tsx, — поэтому
        # без отдельной проверки они компилируются впервые в тот момент,
        # когда ими пытаются что-то выяснить. То есть в самый неудачный.
        run: npx tsc -p apps/api/tsconfig.scripts.json

      - name: Сборка API
        # Раньше здесь была только проверка типов. Этого оказалось мало:
        # неудачная сборка образа оставляет в бою прежний контейнер,
        # и новые маршруты отвечают 404 при зелёном деплое.
        run: npm run build -w @memex/api

      - name: Тесты
        run: npm test
